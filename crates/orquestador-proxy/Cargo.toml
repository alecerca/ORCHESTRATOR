[package]
name = "orquestador-proxy"
description = "Role-enforcing reverse proxy (viewer/editor RBAC) in front of a shared `opencode serve`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Standalone: no dependency on `orquestador-core` or `src-tauri`.
# All new dependencies live here only; the root workspace table is untouched.
[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
